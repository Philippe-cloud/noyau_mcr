$('#sousTitre').textContent='« '+D.question+' » · '+D.acteur.nom+' · '+A.length+' actions · '+Object.keys(S).length+' sources rencontrées';
const VERB={poser:'pose la question',rechercher:'lance la recherche',consulter:'consulte',rejeter:'rejette',relier:'relie',utiliser:'utilise',affirmer:'formule sa réponse'};
const lab=id=>id==='Q'?'Question':D.requetes[id]?'Recherche '+id.slice(1):S[id]?S[id].titre:(D.affirmations.find(a=>a.id===id)||{}).phrase||id;
const short=(t,n)=>t.length>n?t.slice(0,n-1)+'…':t;
// ---------- nœuds et liens ----------
const N={},L=[];
function node(id,type){if(!N[id])N[id]={id,type,x:0,y:0,vx:0,vy:0,t:Infinity};return N[id]}
node('Q','q');Object.keys(D.requetes).forEach(k=>node(k,'r'));Object.keys(S).forEach(k=>node(k,'s'));D.affirmations.forEach(a=>node(a.id,'a'));
const edge=(a,b,k,t)=>L.push({a,b,k,t});
A.forEach((x,i)=>{const t=i+1;
 if(x.action==='poser')N.Q.t=Math.min(N.Q.t,t);
 if(x.action==='rechercher'){N[x.objet].t=Math.min(N[x.objet].t,t);edge('Q',x.objet,'f',t)}
 if(x.action==='consulter'&&N[x.objet]){N[x.objet].t=Math.min(N[x.objet].t,t);const r=ET[x.objet]&&ET[x.objet].trouvee_par;if(r&&!L.some(l=>l.a===r&&l.b===x.objet))edge(r,x.objet,'f',t)}
 if(x.action==='relier'){N[x.objet].t=Math.min(N[x.objet].t,t);N[x.cible].t=Math.min(N[x.cible].t,t);edge(x.objet,x.cible,'m',t)}
 if(x.action==='utiliser'){N[x.objet].t=Math.min(N[x.objet].t,t);N[x.cible].t=Math.min(N[x.cible].t,t);edge(x.objet,x.cible,'u',t);const r=ET[x.objet]&&ET[x.objet].trouvee_par;if(r&&!L.some(l=>l.a===r&&l.b===x.objet))edge(r,x.objet,'f',t)}});
D.affirmations.filter(a=>!a.appuis.length).forEach(a=>{const t=A.findIndex(x=>x.action==='affirmer')+1;N[a.id].t=t});
const col=n=>n.type==='q'?'#7c3aed':n.type==='r'?'#64748b':n.type==='a'?'#0f766e':ET[n.id].statut_d_usage==='utilisée'?'#2e5597':ET[n.id].rejetee?'#e5e7eb':'#c7d2fe';
const rad=n=>n.type==='q'?13:n.type==='r'?9:n.type==='a'?8:ET[n.id].statut_d_usage==='utilisée'?9+Math.min(6,ET[n.id].utilisee_pour.length*1.5):6;
// placement initial par colonnes
const W=900,H=640;const cols={q:60,r:220,s:470,a:770};const cnt={q:0,r:0,s:0,a:0},tot={q:1,r:0,s:0,a:0};Object.values(N).forEach(n=>tot[n.type]++);
Object.values(N).forEach(n=>{const i=cnt[n.type]++;n.x=cols[n.type]+(Math.random()-.5)*30;n.y=40+(H-80)*(i+.5)/tot[n.type]});
// ---------- simulation ----------
let step=0,sel=null;const vis=n=>n.t<=step&&(n.type!=='s'||$('#rej').checked||!ET[n.id].rejetee);
function tick(){const ns=Object.values(N).filter(vis);
 for(const a of ns){a.vx+=(cols[a.type]-a.x)*0.012;a.vy+=(H/2-a.y)*0.0015;
  for(const b of ns){if(a===b)continue;const dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+0.01;if(d2<9000){const f=380/d2;a.vx+=dx*f;a.vy+=dy*f}}}
 for(const l of L){if(l.t>step)continue;const a=N[l.a],b=N[l.b];if(!vis(a)||!vis(b))continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,k=(d-(l.k==='m'?90:150))*0.004;a.vx+=dx/d*k*d*0.02;a.vy+=dy/d*k*d*0.02;b.vx-=dx/d*k*d*0.02;b.vy-=dy/d*k*d*0.02}
 for(const n of ns){if(n===drag)continue;n.vx*=0.82;n.vy*=0.82;n.x=Math.max(15,Math.min(W-15,n.x+n.vx));n.y=Math.max(15,Math.min(H-15,n.y+n.vy))}}
const svg=$('#g');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
svg.innerHTML=`<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><g id="ge"></g><g id="gn"></g>`;
function draw(){const cur=A[step-1];
 $('#ge').innerHTML=L.filter(l=>l.t<=step&&vis(N[l.a])&&vis(N[l.b])).map(l=>{const a=N[l.a],b=N[l.b];const st=l.k==='m'?'stroke="#b45309" stroke-dasharray="5 4"':l.k==='u'?'stroke="#0f766e"':'stroke="#cbd5e1"';
  const hot=cur&&((l.t===step));return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" ${st} stroke-width="${hot?3:1.2}" ${l.k!=='f'?'marker-end="url(#ar)"':''} opacity="${hot?1:.75}"/>`}).join('');
 $('#gn').innerHTML=Object.values(N).filter(vis).map(n=>{const hot=cur&&(cur.objet===n.id||cur.cible===n.id);const r=rad(n);
  const t=n.type==='q'?'Question':n.type==='r'?'R'+n.id.slice(1):n.type==='a'?n.id:short(S[n.id].titre,28);
  return `<g data-id="${n.id}" style="cursor:pointer"><circle cx="${n.x}" cy="${n.y}" r="${r+(hot?4:0)}" fill="${col(n)}" stroke="${sel===n.id?'#111827':hot?'#f59e0b':'#fff'}" stroke-width="${sel===n.id||hot?3:1.5}"/>
  ${(n.type!=='s'||ET[n.id].statut_d_usage==='utilisée'||sel===n.id||hot)?`<text x="${n.x+r+4}" y="${n.y+4}" font-size="11.5" fill="#334155" style="paint-order:stroke;stroke:#fff;stroke-width:3px">${esc(t)}</text>`:''}</g>`}).join('');
 $('#cap').innerHTML=cur?`<b>Action ${step}</b> · <span class="mut">${cur.quand.slice(11,19)} UTC</span> · ${esc(D.acteur.nom)} ${VERB[cur.action]||cur.action} <b>${esc(short(lab(cur.objet),70))}</b>${cur.cible?' → '+esc(short(lab(cur.cible),70)):''}${cur.raison?'<br><i>Raison : '+esc(cur.raison)+'</i>':''}${cur.detail?'<br><span class="mut">'+esc(cur.detail)+'</span>':''}`:'Appuyez sur « Rejouer » ou faites glisser le curseur pour revoir le chemin pas à pas.';
 $('#num').textContent=step+' / '+A.length;
 document.querySelectorAll('#log li').forEach((li,i)=>li.classList.toggle('on',i===step-1))}
let drag=null;
function pt(e){const r=svg.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*W/r.width,y:(p.clientY-r.top)*H/r.height}}
svg.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-id]');if(!g)return;drag=N[g.dataset.id];show(drag.id);svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);drag.x=p.x;drag.y=p.y;drag.vx=drag.vy=0});
svg.addEventListener('pointerup',()=>{drag=null});
function loop(){tick();draw();requestAnimationFrame(loop)}
// ---------- panneau ----------
function etiquette(id){const e=ET[id];const r=(k,v)=>`<tr><td>${k}</td><td>${v}</td></tr>`;const nr=x=>x||'<span class="nr">non renseigné</span>';
 return `<div class="etiq"><div class="tt">ÉTIQUETTE DE PROVENANCE · MCR v0.1</div><table>
 ${r('Source',esc(e.titre))}${r('Auteur',nr(esc(e.auteur)))}${r('Date',nr(esc(e.date)))}${r('Nature',esc(e.nature))}
 ${r('Trouvée par',e.trouvee_par?esc('recherche '+e.trouvee_par.slice(1)+' : « '+D.requetes[e.trouvee_par]+' »'):e.atteinte_depuis.length?'un lien depuis '+e.atteinte_depuis.map(x=>esc(short(S[x].titre,40))).join(', '):'<span class="nr">non renseigné</span>')}
 ${r('Consultée',e.consultations.length?e.consultations.map(c=>c.quand.slice(11,16)+' · '+esc(c.comment)).join('<br>'):'<span class="nr">non consultée</span>')}
 ${r('Usage',e.utilisee_pour.length?'utilisée pour '+e.utilisee_pour.join(', '):e.rejetee?'rejetée : « '+esc(e.rejetee.raison)+' »':esc(e.statut_d_usage))}
 ${r('Mène vers',e.mene_vers.length?e.mene_vers.map(x=>esc(short(S[x].titre,40))).join('<br>'):'—')}
 ${r('Validation',esc(e.validation))}${r('Lien',e.lien?`<a href="${esc(e.lien)}" target="_blank" rel="noopener">ouvrir ↗</a>`:'<span class="nr">aucun</span>')}</table></div>`}
function show(id){sel=id;const P=$('#side');
 if(N[id].type==='s'){P.innerHTML=etiquette(id)+affList(ET[id].utilisee_pour)}
 else if(N[id].type==='a'){const a=D.affirmations.find(x=>x.id===id);P.innerHTML=`<h3 style="font-size:14px;margin:0">Affirmation ${a.id}</h3><div class="aff">${esc(a.phrase)}</div>
  <div class="mut">Origine : <b>${esc(a.origine)}</b> · confiance : <b>${esc(a.confiance)}</b></div>
  ${a.appuis.length?'<div style="margin-top:6px">'+a.appuis.map(x=>`<div><span class="chip" data-go="${x}">${esc(short(S[x].titre,50))}</span>${a.ce_que_dit_la_source[x]?'<div class="mut" style="margin:2px 0 6px 8px">Ce que dit la source, reformulé : '+esc(a.ce_que_dit_la_source[x])+'</div>':''}</div>`).join('')+'</div>':'<div class="mut" style="margin-top:6px"><i>Aucune source : c\'est mon interprétation.</i></div>'}`}
 else if(N[id].type==='r'){const s=Object.values(ET).filter(e=>e.trouvee_par===id);P.innerHTML=`<h3 style="font-size:14px;margin:0">Recherche ${id.slice(1)}</h3><p>« ${esc(D.requetes[id])} »</p>
  <div class="mut">${s.length} source(s) : ${s.filter(e=>e.statut_d_usage==='utilisée').length} utilisée(s), ${s.filter(e=>e.rejetee).length} rejetée(s).</div>${s.map(e=>`<div><span class="chip" data-go="${e.source}">${esc(short(e.titre,55))}</span> <span class="mut">${esc(e.statut_d_usage)}</span></div>`).join('')}`}
 else{P.innerHTML=synthese()}
 P.querySelectorAll('[data-go]').forEach(c=>c.onclick=()=>show(c.dataset.go))}
function affList(ids){return ids.length?'<h3 style="font-size:14px;margin:6px 0 2px">Utilisée pour</h3>'+ids.map(i=>{const a=D.affirmations.find(x=>x.id===i);return `<div class="aff" style="cursor:pointer" data-go="${i}">${esc(a.phrase)}</div>`}).join(''):''}
function synthese(){const E=Object.values(ET);return `<h3 style="font-size:14px;margin:0">La question</h3><p>« ${esc(D.question)} »</p>
 <div class="mut">${E.length} sources rencontrées · ${E.filter(e=>e.statut_d_usage==='utilisée').length} utilisées · ${E.filter(e=>e.rejetee).length} rejetées · ${E.filter(e=>e.statut_d_usage.startsWith('atteinte')).length} atteintes par un lien sans être consultées</div>
 <h3 style="font-size:14px;margin:10px 0 2px">La réponse</h3>${D.affirmations.map(a=>`<div class="aff" style="cursor:pointer" data-go="${a.id}"><b>${a.id}</b> ${esc(a.phrase)} <span class="mut">(${esc(a.origine)}, confiance ${esc(a.confiance)})</span></div>`).join('')}
 <h3 style="font-size:14px;margin:10px 0 2px">Ce que je ne sais pas</h3><ul class="mut" style="padding-left:18px">${D.inconnu.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="mut">${esc(D.note)}</p>`}
$('#log').innerHTML=A.map(x=>`<li>${x.quand.slice(11,19)} · ${VERB[x.action]||x.action} ${esc(short(lab(x.objet),46))}${x.cible?' → '+esc(short(lab(x.cible),30)):''}</li>`).join('');
document.querySelectorAll('#log li').forEach((li,i)=>li.onclick=()=>{step=i+1;$('#pas').value=step;stop()});
// ---------- contrôles ----------
const pas=$('#pas');pas.max=A.length;let timer=null;
function stop(){clearInterval(timer);timer=null;$('#play').textContent='▶ Rejouer'}
$('#play').onclick=()=>{if(timer)return stop();if(step>=A.length)step=0;$('#play').textContent='⏸ Pause';timer=setInterval(()=>{step++;pas.value=step;if(step>=A.length)stop()},420)};
pas.oninput=()=>{step=+pas.value;stop()};$('#rej').onchange=()=>{};
function toast(t){const b=$('#toast');b.textContent=t;b.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>b.classList.remove('show'),2200)}
let DL=null;(async()=>{try{if(window.claude&&window.claude.use)DL=await window.claude.use('downloads')}catch(e){}})();
async function tel(name,txt){if(DL){try{await DL.save({filename:name,data:txt});toast('Fichier enregistré : '+name);return}catch(e){}}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Fichier proposé : '+name)}catch(e){toast('Téléchargement impossible ici.')}}
$('#exp').onclick=()=>tel('trace_filiation_tendances_IA.json',JSON.stringify(D,null,1));
$('#expE').onclick=()=>{if(!sel||!ET[sel])return toast('Sélectionnez d’abord une source.');tel(sel+'.etiquette.json',JSON.stringify(ET[sel],null,1))};
step=A.length;pas.value=step;show('Q');for(let i=0;i<260;i++)tick();loop();
</script></body></html>
