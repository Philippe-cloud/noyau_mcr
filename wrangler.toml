# Déploiement Cloudflare Workers du connecteur « témoin » depuis la racine du dépôt.
# (Le code est dans connecteur/ ; voir connecteur/README.md.)
name = "noyau-mcr"
main = "connecteur/worker.js"
compatibility_date = "2026-10-01"
# Conserver les variables définies dans le tableau de bord Cloudflare (dont JOURNAL_KEY) à chaque déploiement.
keep_vars = true

[[kv_namespaces]]
binding = "JOURNAL"
id = "31105e507bac4bab9eb05e76533b4814"
