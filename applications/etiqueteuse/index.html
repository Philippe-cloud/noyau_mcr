  ['Statut',esc(STATUTS[e.statut])+(e.vue?' · selon '+esc(e.vue):'')],

  ['Usage',[e.usage.citation?'citer : '+esc(e.usage.citation):'citer : <span class="nr">'+NR+'</span>','diffusion : '+nr(e.usage.diffusion==='non renseigné'?'':e.usage.diffusion),'entraînement IA : '+nr(e.usage.entrainement==='non renseigné'?'':e.usage.entrainement)].join('<br>')]];
 $('#apercu').innerHTML=`<div class="etiq"><div class="tt"><span>ÉTIQUETTE DE PROVENANCE</span><span>MCR v0.1 · v${e.version}</span></div><table>${lines.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td></tr>`).join('')}</table>
 <div style="margin-top:6px;border-top:1px solid var(--lab-b);padding-top:5px;font-size:12px">${c.niveau}${e.precedente?' · remplace la version '+(e.version-1):''}</div></div>`;
 $('#chk').innerHTML=[...c.err.map(x=>`<li><span class="badge b-err">à corriger</span> ${esc(x)}</li>`),...c.warn.map(x=>`<li><span class="badge b-warn">à compléter</span> ${esc(x)}</li>`),...c.ok.map(x=>`<li><span class="badge b-ok">ok</span> ${esc(x)}</li>`)].join('');
 $('#jsonld').textContent=JSON.stringify(jsonld(e),null,1)}
const fr=d=>{try{return new Date(d+'T12:00').toLocaleDateString('fr-FR')}catch(x){return d}};
// ---------- formulaire ----------
const opt=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const optK=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${esc(l)}</option>`).join('');
function form(){const e=cur(),F=$('#form');
 if(!e){F.innerHTML='<h2>Aucune étiquette</h2><p class="muted">Créez une étiquette, ou chargez l’exemple pour voir comment elle se remplit.</p>';$('#apercu').innerHTML='';$('#chk').innerHTML='';$('#jsonld').textContent='';return}
 F.innerHTML=`<h2>Remplir l’étiquette <span class="muted">· version ${e.version}</span></h2>
 <fieldset><legend>Élément</legend><div class="row"><div><label>Type</label><select data-k="element.type">${opt(TYPES,e.element.type)}</select></div><div><label>Identifiant</label><input data-k="element.identifiant" value="${esc(e.element.identifiant)}" placeholder="ex. DEF:n02"></div></div>
  <label>Intitulé</label><input data-k="element.intitule" value="${esc(e.element.intitule)}" placeholder="ex. entité-objet">
  <label>Texte de l’élément (facultatif)</label><textarea data-k="element.texte" rows="2">${esc(e.element.texte)}</textarea></fieldset>
 <fieldset><legend>Composition · de quoi il est fait</legend><div class="muted">Chaque source utilisée, où dans la source, et ce qu’on en a fait.</div>
  ${e.composition.map((c,i)=>`<div class="sub"><button class="del" data-delc="${i}" title="Retirer">×</button><div class="row"><div style="flex:2"><label>Source</label><input list="dl-docs" data-c="${i}.source" value="${esc(c.source)}" placeholder="ex. D11, ou référence libre"></div><div><label>Page / passage</label><input data-c="${i}.localisation" value="${esc(c.localisation)}" placeholder="ex. p. 26"></div></div>
  <label>Part</label><select data-c="${i}.part">${opt(PARTS,c.part)}</select></div>`).join('')}
  <button data-addc="1">+ Ajouter une source</button></fieldset>
 <fieldset><legend>Fabrication · qui l’a produit</legend><div class="row"><div style="flex:2"><label>Par</label><input data-k="fabrication.par" value="${esc(e.fabrication.par)}" placeholder="nom de la personne ou de l’IA"></div><div><label>Nature</label><select data-k="fabrication.nature">${optK({humain:'humain',ia:'IA',collectif:'collectif'},e.fabrication.nature)}</select></div></div>
  <div class="row"><div><label>Opération</label><select data-k="fabrication.operation">${opt(OPS,e.fabrication.operation)}</select></div><div><label>Date</label><input type="date" data-k="fabrication.date" value="${esc(e.fabrication.date)}"></div></div></fieldset>
 <fieldset><legend>Validations · qui l’a examiné</legend>
  ${e.validations.map((v,i)=>`<div class="sub"><button class="del" data-delv="${i}" title="Retirer">×</button><div class="row"><div style="flex:2"><label>Par</label><input data-v="${i}.par" value="${esc(v.par)}"></div><div><label>Nature</label><select data-v="${i}.nature">${optK({humain:'humain',ia:'IA'},v.nature)}</select></div></div>
  <div class="row"><div><label>Rôle</label><input data-v="${i}.role" value="${esc(v.role)}" placeholder="autorité, tiers…"></div><div><label>Statut donné</label><select data-v="${i}.statut">${optK(STATUTS,v.statut)}</select></div><div><label>Date</label><input type="date" data-v="${i}.date" value="${esc(v.date)}"></div></div>
  <label>Grille ou fiche utilisée</label><input data-v="${i}.grille" value="${esc(v.grille)}" placeholder="ex. fiche d’audit n° 12">
  <label>Commentaire</label><input data-v="${i}.commentaire" value="${esc(v.commentaire)}"></div>`).join('')||'<div class="muted">Aucune validation pour l’instant.</div>'}
  <button data-addv="1">+ Ajouter une validation</button></fieldset>
 <fieldset><legend>Statut et vue</legend><div class="row"><div><label>Statut</label><select data-k="statut">${optK(STATUTS,e.statut)}</select></div><div style="flex:2"><label>Selon quelle vue</label><input data-k="vue" value="${esc(e.vue)}" placeholder="ex. la MCR, la tradition de tel maître…"></div></div></fieldset>
 <fieldset><legend>Filiation</legend><label>Dérive de (séparer par ;)</label><input list="dl-docs" data-k="filiation.derive_de" value="${esc(e.filiation.derive_de)}" placeholder="ex. D11 ; D26"><label>Liée à</label><input list="dl-cs" data-k="filiation.lie_a" value="${esc(e.filiation.lie_a)}" placeholder="ex. opération de génération"></fieldset>
 <fieldset><legend>Usage</legend><label>Comment le citer</label><input data-k="usage.citation" value="${esc(e.usage.citation)}">
  <div class="row"><div><label>Diffusion</label><select data-k="usage.diffusion">${opt(['non renseigné','libre','autorisée avec citation','à demander','interdite'],e.usage.diffusion)}</select></div><div><label>Entraînement des IA</label><select data-k="usage.entrainement">${opt(['non renseigné','autorisé','autorisé avec citation','non autorisé'],e.usage.entrainement)}</select></div></div></fieldset>
 <div class="row noprint"><button class="pri" id="bVer" title="Garde la version actuelle et en crée une nouvelle">Nouvelle version</button><button id="bDup">Dupliquer</button><button id="bDel" style="color:var(--err)">Supprimer</button></div>
 <datalist id="dl-docs">${REF.docs.map(d=>`<option value="${d.id}">${esc(d.t)}</option>`).join('')}</datalist><datalist id="dl-cs">${REF.concepts.map(c=>`<option value="${esc(c.l)}">`).join('')}</datalist>`;
 const set=(o,path,val)=>{const k=path.split('.');let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x[k[k.length-1]]=val};
 F.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{set(e,i.dataset.k,i.value);save();apercu(e);liste()});
 F.querySelectorAll('[data-c]').forEach(i=>i.oninput=()=>{const [n,f]=i.dataset.c.split('.');e.composition[n][f]=i.value;save();apercu(e)});
 F.querySelectorAll('[data-v]').forEach(i=>i.oninput=()=>{const [n,f]=i.dataset.v.split('.');e.validations[n][f]=i.value;save();apercu(e)});
 F.querySelectorAll('[data-delc]').forEach(b=>b.onclick=()=>{e.composition.splice(+b.dataset.delc,1);if(!e.composition.length)e.composition.push({source:'',localisation:'',part:'texte de l’auteur'});save();form()});
 F.querySelectorAll('[data-delv]').forEach(b=>b.onclick=()=>{e.validations.splice(+b.dataset.delv,1);save();form()});
 F.querySelector('[data-addc]').onclick=()=>{e.composition.push({source:'',localisation:'',part:'texte de l’auteur'});save();form()};
 F.querySelector('[data-addv]').onclick=()=>{e.validations.push({par:'',nature:'humain',role:'',statut:'valide',date:today(),grille:'',commentaire:''});save();form()};
 $('#bVer').onclick=()=>{const n=JSON.parse(JSON.stringify(e));n.precedente=e.id+':v'+e.version;n.version=e.version+1;n.id=e.id;e.archivee=true;
  e.id=e.id+'_v'+e.version;ST.etiquettes.push(n);ST.sel=n.id;save();render();toast('Version '+n.version+' créée ; la version '+(n.version-1)+' est conservée.')};
 $('#bDup').onclick=()=>{const n=JSON.parse(JSON.stringify(e));n.id=uid();n.version=1;n.precedente=null;n.archivee=false;n.element.intitule+=' (copie)';ST.etiquettes.push(n);ST.sel=n.id;save();render()};
 $('#bDel').onclick=()=>{if(!confirmDel){confirmDel=true;$('#bDel').textContent='Confirmer la suppression';return}ST.etiquettes=ST.etiquettes.filter(x=>x!==e);ST.sel=ST.etiquettes.filter(x=>!x.archivee).slice(-1)[0]?.id||null;confirmDel=false;save();render()};
 apercu(e)}
let confirmDel=false;
function liste(){const L=ST.etiquettes.filter(e=>!e.archivee);$('#nb').textContent=L.length+' étiquette(s)'+(ST.etiquettes.length>L.length?' · '+(ST.etiquettes.length-L.length)+' version(s) antérieure(s) conservée(s)':'');
 $('#liste').innerHTML=L.map(e=>{const c=controle(e);return `<div class="item ${e.id===ST.sel?'on':''}" data-id="${e.id}"><b>${esc(e.element.intitule||'(sans intitulé)')}</b><div class="muted">${esc(e.element.type)} · ${esc(STATUTS[e.statut])} · v${e.version}</div><span class="badge ${c.err.length?'b-err':c.warn.length?'b-warn':'b-ok'}">${c.niveau}</span></div>`}).join('')||'<div class="muted">Aucune.</div>';
 document.querySelectorAll('.item').forEach(n=>n.onclick=()=>{ST.sel=n.dataset.id;confirmDel=false;save();render()})}
function render(){liste();form()}
// ---------- actions ----------
$('#bNew').onclick=()=>{const e=vide();ST.etiquettes.push(e);ST.sel=e.id;save();render()};
$('#bEx').onclick=()=>{const e=vide();Object.assign(e,{element:{type:'définition',identifiant:'DEF:n02',intitule:'entité-objet',texte:'Ce que produit une opération de génération et que l’on va ensuite qualifier.'},
 composition:[{source:'D11',localisation:'chap. 1 (repère du corpus)',part:'texte de l’auteur'},{source:'D11',localisation:'chap. 1',part:'reformulation par une IA'}],
 fabrication:{par:'IA (Claude)',nature:'ia',operation:'reformulation',date:'2026-10-24'},validations:[],statut:'propose',vue:'la MCR',
 filiation:{derive_de:'D11',lie_a:'opération de génération ; description relativisée'},usage:{citation:'Définition proposée par l’IA à partir de D11, à valider par l’autrice',diffusion:'à demander',entrainement:'non autorisé'}});
 ST.etiquettes.push(e);ST.sel=e.id;save();render();toast('Exemple chargé : une définition proposée par une IA, pas encore validée.')};
let DL=null;(async()=>{try{if(window.claude&&window.claude.use)DL=await window.claude.use('downloads')}catch(e){}})();
async function telecharger(name,txt){if(DL){try{await DL.save({filename:name,data:txt});toast('Fichier enregistré : '+name);return}catch(e){}}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Fichier proposé : '+name)}catch(e){toast('Téléchargement impossible ici : utilisez « Copier ».')}}
async function copier(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg)}}
$('#bCopy').onclick=()=>{const e=cur();if(e)copier(JSON.stringify(jsonld(e),null,1),'JSON-LD copié.')};
$('#bHtml').onclick=()=>{const e=cur();if(e)copier('<script type="application/ld+json">\n'+JSON.stringify(jsonld(e),null,1)+'\n</'+'script>','Balise copiée : à coller dans la page du document.')};
$('#bOne').onclick=()=>{const e=cur();if(e)telecharger((e.element.identifiant||e.element.intitule||'etiquette').replace(/[^\w.-]+/g,'_')+'.etiquette.json',JSON.stringify(jsonld(e),null,1))};
$('#bPrint').onclick=()=>window.print();
$('#bExp').onclick=()=>telecharger('etiquettes_MCR_'+today()+'.json',JSON.stringify({format:'etiquettes-mcr-v0.1',exporteLe:new Date().toISOString(),etiquettes:ST.etiquettes,jsonld:ST.etiquettes.filter(e=>!e.archivee).map(jsonld)},null,1));
$('#fImp').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(o.format!=='etiquettes-mcr-v0.1')throw 0;const ids=new Set(ST.etiquettes.map(e=>e.id));let n=0;o.etiquettes.forEach(e=>{if(!ids.has(e.id)){ST.etiquettes.push(e);n++}});save();render();toast(n+' étiquette(s) importée(s).')}catch(e){toast('Ce fichier n’est pas un export de l’étiqueteuse.')}ev.target.value=''};
$('#bAide').onclick=()=>{const F=$('#form');F.innerHTML=`<h2>Aide</h2><p>Comme l’étiquette cousue dans un vêtement, l’étiquette de provenance accompagne un élément archivé (document, résumé, définition, relation…) et dit, toujours dans le même ordre :</p>
 <ul><li><b>Composition</b> : de quelles sources il est fait, à quelle page, et ce qu’on en a fait (texte de l’auteur, reformulation par une IA…).</li><li><b>Fabriqué</b> : qui l’a produit, par quelle opération, quand.</li><li><b>Validé</b> : qui l’a examiné, avec quel statut et quelle fiche.</li><li><b>Statut et vue</b> : ce que vaut l’élément, et selon quel point de vue (MCR : toute connaissance est relative à sa génération et à la vue qui la qualifie).</li><li><b>Filiation</b> : ce dont il dérive, ce à quoi il se rattache.</li><li><b>Usage</b> : comment le citer, s’il peut être diffusé, s’il peut servir à entraîner des IA.</li></ul>
 <p>Ce qui manque reste marqué « non renseigné » : on ne maquille pas une case vide. Le contrôle de conformité signale ce qui manque et refuse qu’un contenu fabriqué par une IA soit marqué validé sans validation humaine.</p>
 <p><b>Nouvelle version</b> conserve l’étiquette actuelle et en crée une nouvelle, par exemple après une validation : l’historique reste consultable. <b>Copier la balise HTML</b> donne le bloc à placer dans la page web du document ; <b>Télécharger</b> donne le fichier à joindre au document (même nom, suffixe .etiquette.json).</p>
 <p class="muted">Les étiquettes sont gardées dans ce navigateur. « Exporter tout » produit un fichier à conserver ou à transmettre ; « Importer » le recharge.</p><button class="pri" id="bRet">Revenir à l’étiquette</button>`;$('#bRet').onclick=form};
if(!ST.etiquettes.length){}else if(!cur())ST.sel=ST.etiquettes.filter(e=>!e.archivee).slice(-1)[0]?.id;
render();
</script></body></html>
