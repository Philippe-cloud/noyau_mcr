name: Boucle du noyau
on:
  push:
    paths: ['corpus/**/entrees/**', 'ancrage/**']
  workflow_dispatch:
jobs:
  boucle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: |
          python -m ancrage boucle corpus/mcr
      - uses: actions/upload-artifact@v4
        with:
          name: sorties
          path: corpus/*/sorties/
