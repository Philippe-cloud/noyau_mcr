name: Boucle du noyau
on:
  push:
    paths: ['corpus/**/entrees/**', 'ancrage/**', 'applications/**', 'exemples/filiation/**', '!corpus/**/audits_ia/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  boucle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: |
          python -m ancrage boucle corpus/mcr
      - uses: actions/upload-artifact@v4
        with:
          name: sorties
          path: corpus/*/sorties/
      - name: Préparer le site (application publique)
        run: |
          mkdir -p site
          cp "$(ls -d corpus/mcr/sorties/*/ | sort | tail -1)explorer_mcr.html" site/index.html
          mkdir -p site/etiqueteuse site/exemples site/trajectoire && cp applications/etiqueteuse/index.html site/etiqueteuse/index.html && cp applications/trajectoire/index.html site/trajectoire/index.html
          cp exemples/filiation/filiation_tendances_IA.html site/exemples/filiation_tendances_IA.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publier:
    needs: boucle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
